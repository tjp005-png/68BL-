<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Harbors - Backup Manager Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .ch-red-bg { background-color: #970000 !important; color: white; }
        .ch-dark-red-border { border-top: 5px solid #5a0000 !important; }
        .btn-ch-red { background-color: #970000; color: white; font-weight: bold; border: none; }
        .btn-ch-red:hover { background-color: #5a0000; color: white; }
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 420px; border-radius: 12px; overflow: hidden; border: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card shadow login-card ch-dark-red-border mx-auto">
            <div class="card-body ch-red-bg text-center p-4">
                <h4 class="mb-0 fw-bold">⚙️ Backups Manager</h4>
                <p class="mb-0 small opacity-75 mt-1">Authorized Access Only</p>
            </div>
            
            <div class="card-body p-4 bg-white">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form action="" method="POST">
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold text-secondary">Admin Password</label>
                        <input type="password" class="form-control form-control-lg border-2" id="password" name="password" placeholder="••••••••" required autofocus>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-ch-red btn-lg py-2">Sign In</button>
                        <a href="/" class="btn btn-outline-secondary py-2">Cancel</a>
                    </div>
                </form>
            </div>
            
            <div class="card-footer bg-light text-center py-3 text-muted small">
                Clean Harbors Buttonwillow
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
